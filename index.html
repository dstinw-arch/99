<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>敬老金銷帳系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --deep:#365955; --mid:#508E7E; --mist:#E2F2EE; --clay:#DB8F65; --peach:#FFC7B3;
  --bg:#F4FAF8; --card:#FFFFFF; --ink:#22403C; --ink2:#4E6E69; --line:#CFE5DF;
  --ok:#508E7E; --warn:#DB8F65; --bad:#C2553B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* header */
header{background:var(--deep);color:#fff}
header .wrap{display:flex;align-items:center;gap:14px;min-height:68px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.05em}
header .who{margin-left:auto;display:flex;align-items:center;gap:10px}
.badge{background:var(--peach);color:var(--deep);border-radius:999px;padding:4px 14px;font-weight:700}
.btn-ghost{background:transparent;border:1.5px solid rgba(255,255,255,.6);color:#fff;border-radius:10px;padding:6px 14px;cursor:pointer}

nav.tabs{display:flex;gap:6px;margin:18px 0 6px;flex-wrap:wrap}
nav.tabs button{border:none;background:var(--mist);color:var(--deep);padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:18px}
nav.tabs button.on{background:var(--mid);color:#fff}

.card{background:var(--card);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 2px 0 var(--line)}
.card h2{margin:0 0 14px;font-size:21px;color:var(--deep)}
.muted{color:var(--ink2)}
.btn{border:none;border-radius:12px;padding:12px 22px;font-weight:700;cursor:pointer;font-size:19px}
.btn-main{background:var(--mid);color:#fff}
.btn-main:hover{background:var(--deep)}
.btn-clay{background:var(--clay);color:#fff}
.btn-soft{background:var(--mist);color:var(--deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=password],input[type=date],select,textarea{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--mid)}
label.chk{display:flex;align-items:center;gap:10px;font-size:19px;padding:10px 12px;border-radius:12px;background:#FFF3EE;margin:8px 0;cursor:pointer}
label.chk input{width:24px;height:24px;accent-color:var(--clay)}

/* login */
.login{max-width:420px;margin:60px auto}
.login .logo{width:64px;height:64px;border-radius:50%;background:var(--mid);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;margin:0 auto 10px}
.login h1{text-align:center;font-size:26px;margin:0 0 4px;color:var(--deep)}
.login p.sub{text-align:center;margin:0 0 20px}
.field{margin:12px 0}
.field > span{display:block;font-weight:700;margin-bottom:6px;color:var(--deep)}
.err{color:var(--bad);font-weight:700;min-height:1.5em}

/* lookup */
.search{display:flex;gap:12px}
.search input{font-size:34px;letter-spacing:.15em;font-weight:700;text-align:center;padding:12px}
.search .btn{font-size:22px;white-space:nowrap}
.result{margin-top:18px}
.mbox{border-radius:18px;padding:22px;display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.mbox.free{background:var(--mist)}
.mbox.done{background:#FDEDE7}
.mbox.none{background:#FDEDE7}
.mno{font-size:20px;color:var(--ink2)}
.mno b{display:block;font-size:40px;color:var(--deep);letter-spacing:.1em}
.amt{font-size:52px;font-weight:900;color:var(--deep)}
.amt small{font-size:20px;font-weight:500}
.amt.a2000{color:var(--clay)}
.state{margin-left:auto;text-align:right;font-size:22px;font-weight:700}
.state.ok{color:var(--mid)}
.state.no{color:var(--bad)}
.actions{margin-top:16px}
.radio{display:flex;gap:10px;margin:8px 0 12px}
.radio label{flex:1;text-align:center;padding:12px;border-radius:12px;border:2px solid var(--line);cursor:pointer;font-weight:700;background:#fff}
.radio input{display:none}
.radio input:checked + span{color:#fff}
.radio label:has(input:checked){background:var(--mid);border-color:var(--mid);color:#fff}
.bigbtn{width:100%;font-size:26px;padding:18px}
.alert{background:var(--peach);color:#6B3018;border-radius:14px;padding:14px 18px;font-weight:700;margin:12px 0}
.alert.same{background:#FDE2DA;color:#7A1F0E;border:2px solid #C2553B;font-size:19px}
.alert.note{background:#FFE9A8;color:#5A4300;border:2px solid #E0B43A}
.alert.soft{background:#FFF3EE;font-weight:500}
.rp{border-top:1.5px dashed var(--line);padding:12px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.rp:first-child{border-top:none}
.tag{display:inline-block;border-radius:999px;padding:2px 12px;font-size:15px;font-weight:700}
.tag.pend{background:var(--peach);color:#7A3418}
.tag.done{background:var(--mist);color:var(--deep)}
.row2{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:end}
details.rpform{margin-top:14px}
details.rpform summary{cursor:pointer;font-weight:700;color:var(--clay);font-size:19px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kpi{border-radius:18px;padding:18px;color:#fff}
.kpi .k{font-size:18px;opacity:.95}
.kpi .v{font-size:40px;font-weight:900;line-height:1.15}
.kpi .s{font-size:16px;opacity:.95}
.kpi.k500{background:var(--mid)}
.kpi.k1000{background:var(--deep)}
.kpi.k2000{background:var(--clay)}
.kpi.ktot{background:#fff;color:var(--deep);border:2px solid var(--line)}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.35);margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px}
.ktot .bar{background:var(--mist)} .ktot .bar i{background:var(--mid)}

table{border-collapse:collapse;width:100%;font-size:17px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--mist);color:var(--deep);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sum td{font-weight:900;background:#F7FBFA}
.recon th,.recon td{text-align:right;font-variant-numeric:tabular-nums}
.recon th:first-child,.recon td:first-child{text-align:left}
.recon .g{border-left:2px solid var(--line)}
.recon thead tr:first-child th{text-align:center}
.recon tr.daysum td{font-weight:900;background:#FFF3EE}
.recon tr.grand td{font-weight:900;background:var(--mist)}
.recon tr.hqrow td{border-bottom:3px double var(--mid)}
.recon tr.split td{font-weight:700;background:#F7FBFA;border-top:3px double var(--mid)}
.recon tr.subsum td{font-weight:900;background:#FFF3EE;color:#7A3418}
.recon tr.split td:first-child,.recon tr.subsum td:first-child,.recon tr.grand td:first-child{white-space:nowrap}
@media print{.recon tr.subsum td{background:#fff!important;color:#000!important;border-top:2px solid #000;border-bottom:2px solid #000}}
.recon td.click{cursor:pointer;color:var(--mid);text-decoration:underline}
.dayhead{font-size:20px;font-weight:900;color:var(--deep);margin:20px 0 8px}
.tablebox{overflow:auto;max-height:520px;border-radius:12px;border:1px solid var(--line)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:14px 26px;border-radius:14px;font-weight:700;font-size:20px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:9}
.toast.bad{background:var(--bad)}
footer{text-align:center;color:var(--ink2);font-size:15px;padding:30px 0}

/* print: 日報 */
#printArea{display:none}
@media print{
  body{background:#fff;font-size:15px}
  header,nav,.card,footer,.toast,#app > *:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea h1{font-size:22px;text-align:center;margin:0 0 4px}
  #printArea .meta{text-align:center;margin-bottom:12px}
  #printArea table{font-size:14px}
  #printArea th{background:#eee}
  .sig{display:flex;justify-content:space-around;margin-top:40px;font-size:16px}
}
@media (pointer: coarse){
  #claimBtn{position:fixed;left:16px;right:16px;bottom:16px;width:auto;z-index:5;box-shadow:0 6px 18px rgba(54,89,85,.35)}
  #qResult:has(#claimBtn){padding-bottom:90px}
  .toast{bottom:auto;top:16px}
  .search input{font-size:30px}
}
@media (pointer: coarse) and (max-width:640px){
  header .wrap{min-height:52px}
  header h1{font-size:16px}
  .badge{padding:2px 10px;font-size:15px}
  .btn-ghost{padding:4px 10px;font-size:15px}
  nav.tabs{margin:10px 0 0}
  nav.tabs button{padding:7px 12px;font-size:16px}
  .card{padding:16px;margin:10px 0}
  .mbox{padding:16px;gap:8px}
  .mno b{font-size:30px}
  .amt{font-size:40px}
}
@media (max-width:640px){
  .search{flex-direction:column}
  .state{margin-left:0;text-align:left}
  .row2{grid-template-columns:1fr}
  header h1{font-size:19px}
}
</style>
</head>
<body>
<div id="app">

<!-- 登入 -->
<section id="loginView" class="hidden">
  <div class="login card">
    <div class="logo">敬</div>
    <h1>敬老金銷帳系統</h1>
    <p class="sub muted">115 年度・v16</p>
    <div class="field"><span>單位</span>
      <select id="lgBranch"></select>
    </div>
    <div class="field"><span>密碼</span>
      <input type="password" id="lgPw" autocomplete="current-password">
    </div>
    <div class="err" id="lgErr"></div>
    <button class="btn btn-main bigbtn" id="lgBtn">登入</button>
  </div>
</section>

<!-- 主畫面 -->
<section id="mainView" class="hidden">
  <header><div class="wrap">
    <h1>敬老金銷帳系統</h1>
    <div class="who"><span class="badge" id="whoBadge"></span><button class="btn-ghost" id="logoutBtn">登出</button></div>
  </div></header>

  <div class="wrap">
    <nav class="tabs" id="tabs"></nav>

    <!-- 查詢銷帳 -->
    <div id="tab-lookup">
      <div class="card">
        <div class="alert hidden" id="backfillBanner"></div>
        <h2>輸入社籍號碼</h2>
        <div class="search">
          <input type="text" id="qNo" inputmode="numeric" enterkeyhint="go" maxlength="8" placeholder="例：000614" autocomplete="off">
          <button class="btn btn-main" id="qBtn">查詢</button>
        </div>
        <div class="result" id="qResult"></div>
      </div>
    </div>

    <!-- 本社日報 -->
    <div id="tab-day" class="hidden">
      <div class="card">
        <h2>本社每日對帳（發放期間）</h2>
        <div class="toolbar">
          <button class="btn btn-clay" id="sumPrint">列印期間彙總</button>
          <span class="muted">點日期可看當天明細</span>
        </div>
        <div class="tablebox" style="max-height:none"><table id="sumTable" class="recon"></table></div>
      </div>
      <div class="card">
        <h2>本社銷帳日報</h2>
        <div class="toolbar">
          <input type="date" id="dayDate">
          <button class="btn btn-soft" id="dayLoad">重新整理</button>
          <button class="btn btn-clay" id="dayPrint">列印日報</button>
        </div>
        <div class="kpis" id="dayKpis"></div>
        <div class="tablebox" style="margin-top:14px"><table id="dayTable"></table></div>
      </div>
    </div>

    <!-- 管理員：總覽 -->
    <div id="tab-overview" class="hidden">
      <div id="ovAlerts"></div>
      <div class="card">
        <h2>發放總覽 <span class="muted" style="font-size:16px;font-weight:400" id="ovTime"></span></h2>
        <div class="kpis" id="ovKpis"></div>
      </div>
      <div class="card">
        <h2>各分社銷帳統計</h2>
        <div class="toolbar">
          <select id="ovDay"></select>
          <button class="btn btn-soft" id="ovReload">重新整理</button>
          <button class="btn btn-soft" id="ovCsvBranch">下載統計 CSV</button>
        </div>
        <div class="tablebox"><table id="ovBranch"></table></div>
      </div>
    </div>

    <!-- 管理員：帳號管理 -->
    <div id="tab-acct" class="hidden">
      <div class="card">
        <h2>帳號管理</h2>
        <div class="muted" style="margin-bottom:12px">重設密碼或停用後，該帳號在所有電腦、手機上都會被強制登出。新密碼只會顯示這一次，請自行記下再私下發給分社。</div>
        <div class="tablebox" style="max-height:none"><table id="acctTable"></table></div>
        <div id="acctMsg"></div>
      </div>
    </div>

    <!-- 管理員：每日對帳 -->
    <div id="tab-recon" class="hidden">
      <div class="card">
        <h2>每日對帳（分社 × 日期）</h2>
        <div class="toolbar">
          <select id="rcDay"></select>
          <select id="rcBranch"></select>
          <button class="btn btn-soft" id="rcReload">重新整理</button>
          <button class="btn btn-soft" id="rcCsv">下載對帳 CSV</button>
          <button class="btn btn-clay" id="rcPrint">列印</button>
        </div>
        <div id="rcBody"></div>
      </div>
    </div>

    <!-- 管理員：明細 -->
    <div id="tab-claims" class="hidden">
      <div class="card">
        <h2>銷帳明細</h2>
        <div class="toolbar">
          <input type="text" id="clFilter" placeholder="篩選社籍號碼" style="max-width:200px">
          <select id="clBranch"></select>
          <select id="clAmt"><option value="">全部金額</option><option>500</option><option>1000</option><option>2000</option></select>
          <button class="btn btn-soft" id="clCsv">下載明細 CSV</button>
          <button class="btn btn-soft" id="clUnclaimed">下載未領名單 CSV</button>
          <button class="btn btn-soft" id="clSame">下載同名同姓清單 CSV</button>
        </div>
        <div class="muted" id="clCount"></div>
        <div class="tablebox"><table id="clTable"></table></div>
      </div>
      <div class="card">
        <h2>註記（待確認事項）</h2>
        <div class="tablebox"><table id="noteTable"></table></div>
      </div>
      <div class="card">
        <h2>撤銷紀錄</h2>
        <div class="tablebox"><table id="logTable"></table></div>
      </div>
    </div>

    <!-- 補發通知單 -->
    <div id="tab-reprint" class="hidden">
      <div class="card">
        <h2>補發通知單・待更新地址</h2>
        <div class="toolbar">
          <select id="rpShow"><option value="pend">只看未更新地址</option><option value="all">全部</option></select>
          <button class="btn btn-soft" id="rpCsv">下載 CSV</button>
        </div>
        <div class="tablebox"><table id="rpTable"></table></div>
      </div>
    </div>
  </div>
  <footer>敬老金銷帳系統・v16</footer>
</section>

<div id="printArea"></div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL = 'https://euzcnkxxqwvkzutopwau.supabase.co';
const SUPABASE_KEY = 'sb_publishable_iW5bLz3gFFVvCP6MLTRIww_YZTOkNGb';
const APP_VER = '16';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }   // 關掉分頁／瀏覽器就要重新登入
});
try { Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k)); } catch(e){}  // 清掉舊版留在電腦上的登入
const IDLE_MS = 15 * 60 * 1000;
let lastAct = Date.now();
['click','keydown','touchstart','mousemove','scroll'].forEach(ev => window.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
setInterval(async () => {
  if (ME && Date.now() - lastAct > IDLE_MS) {
    await sb.auth.signOut(); $('qResult').innerHTML = ''; showLogin();
    $('lgErr').textContent = '閒置超過 15 分鐘，已自動登出，請重新登入';
  }
}, 30000);

const BRANCHES = [
  ['0016','營業部'],['0025','水碓'],['0034','竹圍'],['0043','英專'],['0052','義山'],['0061','三芝'],
  ['0070','八里'],['0089','成州'],['0098','五股'],['0104','萬金'],['0113','新莊'],['0122','泰山'],
  ['0131','林口'],['0140','板橋'],['0159','蘆洲'],['0168','三重']
];
const ADMIN = ['9999','管理員'];
const emailOf = code => `elder-${code}@example.com`;

let ME = null, ADMIN_DATA = null, refreshTimer = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n).toLocaleString('zh-TW');
const pad6 = s => (String(s).replace(/\D/g,'')).padStart(6,'0');
function tw(ts){ // 民國日期時間
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  const f = new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
  const g = t => f.find(x=>x.type===t).value;
  return `${g('year')-1911}/${g('month')}/${g('day')} ${g('hour')}:${g('minute')}`;
}
function twDateKey(ts){ // YYYY-MM-DD (台北)
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date(ts));
}
function rocDate(key){ const [y,m,d] = key.split('-'); return `${y-1911} 年 ${+m} 月 ${+d} 日`; }
function todayKey(){ return twDateKey(Date.now()); }
function toast(msg, bad){
  const t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad?' bad':'');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.add('hidden'), 3200);
}
async function rpc(name, args={}){
  const { data, error } = await sb.rpc(name, args);
  if (error) throw new Error(error.message);
  return data;
}
function csvDownload(name, rows){
  const body = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + body], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function staffName(){ try { return localStorage.getItem('elder_staff') || ''; } catch(e){ return ''; } }
function saveStaff(v){ try { localStorage.setItem('elder_staff', v); } catch(e){} }

/* ---------- 登入 ---------- */
function initLogin(){
  $('lgBranch').innerHTML = BRANCHES.map(([c,n]) => `<option value="${c}">${c} ${n}</option>`).join('')
    + `<option value="${ADMIN[0]}">管理員</option>`;
  try { const last = localStorage.getItem('elder_branch'); if (last) $('lgBranch').value = last; } catch(e){}
  $('lgBtn').onclick = doLogin;
  $('lgPw').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
}
async function doLogin(){
  $('lgErr').textContent = '';
  const code = $('lgBranch').value, pw = $('lgPw').value;
  if (!pw) { $('lgErr').textContent = '請輸入密碼'; return; }
  $('lgBtn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: emailOf(code), password: pw });
  $('lgBtn').disabled = false;
  if (error) { $('lgErr').textContent = '密碼錯誤'; return; }
  try { localStorage.setItem('elder_branch', code); } catch(e){}
  $('lgPw').value = '';
  await enter();
}
async function enter(){
  try { ME = await rpc('elder_whoami'); }
  catch(e){ await sb.auth.signOut(); showLogin(); return; }
  $('loginView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  $('whoBadge').textContent = ME.is_admin ? '管理員' : `${ME.branch_code} ${ME.branch_name}`;
  const tabs = ME.is_admin
    ? [['overview','發放總覽'],['recon','每日對帳'],['claims','銷帳明細'],['reprint','補發／地址'],['lookup','查詢'],['acct','帳號管理']]
    : [['lookup','查詢銷帳'],['day','本社日報'],['reprint','補發／地址']];
  $('tabs').innerHTML = tabs.map(([k,n]) => `<button data-tab="${k}">${n}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
  showTab(tabs[0][0]);
  if (ME.is_admin) { clearInterval(refreshTimer); refreshTimer = setInterval(loadAdmin, 60000); }
}
function showLogin(){
  ME = null; clearInterval(refreshTimer);
  $('mainView').classList.add('hidden'); $('loginView').classList.remove('hidden');
}
$('logoutBtn').onclick = async () => { await sb.auth.signOut(); $('qResult').innerHTML=''; showLogin(); };

function showTab(k){
  ['lookup','day','overview','recon','claims','reprint','acct'].forEach(t => $('tab-'+t).classList.toggle('hidden', t!==k));
  $('tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab===k));
  if (k==='lookup') { updateBackfillBanner(); setTimeout(()=>$('qNo').focus(), 50); }
  if (k==='day') { loadDay(); loadSummary(); }
  if (k==='overview' || k==='claims' || k==='recon') loadAdmin();
  if (k==='reprint') loadReprints();
  if (k==='acct') loadAccounts();
}

/* ---------- 補登時段（與資料庫 elder_backfill 設定一致） ---------- */
const BACKFILL = [{ keyDay:'2026-10-13', until:'11:00', asDay:'2026-10-12' }];
function backfillNow(){
  const now = new Date();
  const day = twDateKey(now);
  const hm = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false}).format(now);
  return BACKFILL.find(b => b.keyDay === day && hm < b.until);
}
function updateBackfillBanner(){
  const b = backfillNow(), el = $('backfillBanner');
  if (!el) return;
  if (b) { el.textContent = `補登時段：現在 KEY 入的都算 ${rocDate(b.asDay)} 的帳（${b.until} 以後才算今天）`; el.classList.remove('hidden'); }
  else el.classList.add('hidden');
}
setInterval(updateBackfillBanner, 30000);

// iPhone Safari 只允許「點按當下」開新視窗，所以可先開好空白視窗再傳進來
function openPrintWin(){
  const w = window.open('', '_blank');
  if (!w) { toast('請允許此網站開啟彈出視窗後再列印（Safari：設定 → Safari → 關閉「阻擋彈出式視窗」）', true); return null; }
  try { w.document.write('<p style="font:20px sans-serif;padding:30px">準備列印中…</p>'); } catch(e){}
  return w;
}
function printNotice(no, amount, preWin){
  if (!AMT_TW[amount]) { toast('金額不正確，無法列印', true); if (preWin) preWin.close(); return; }
  const w = preWin || openPrintWin();
  if (!w) return;
  w.document.open(); w.document.write(noticeHtml(no, amount)); w.document.close();
  const go = () => { w.focus(); w.print(); };
  const imgs = [...w.document.images].map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })).filter(Boolean);
  Promise.all([...imgs, w.document.fonts ? w.document.fonts.ready : null]).then(() => setTimeout(go, 300));
}

/* ---------- 查詢 / 銷帳 ---------- */
$('qBtn').onclick = doLookup;
$('qNo').onkeydown = e => {
  // Tab：在「本人領取／代領」之間切換（游標留在號碼欄，接著按 Enter 即可銷帳）
  if (e.key === 'Tab' && $('claimBtn') && document.querySelector('input[name=who]')) {
    e.preventDefault();
    const cur = document.querySelector('input[name=who]:checked').value;
    document.querySelector(`input[name=who][value=${cur==='self'?'proxy':'self'}]`).checked = true;
    toast(cur==='self' ? '已切換為：代領' : '已切換為：本人領取');
    return;
  }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const v = $('qNo').value.trim();
  // 同一個號碼已查出且可銷帳 → 第二次 Enter 直接銷帳
  if (CUR && CUR.found && v && pad6(v) === CUR.member_no && $('claimBtn')) {
    const cb = $('claimBtn');
    if (cb.disabled) { toast($('ck1') ? '請先勾選核對身分證字號' + ($('ck2') ? '及戶籍地址' : '') : '處理中…', true); return; }
    doClaim(); return;
  }
  doLookup();
};
const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;
$('qNo').oninput = () => {
  const v = $('qNo').value.replace(/\D/g,'');
  if (CUR && pad6(v) !== CUR.member_no) { CUR = null; $('qResult').innerHTML = ''; }
  // 手機：打滿 6 碼自動查詢並收起鍵盤
  if (IS_TOUCH && v.length === 6 && !(CUR && CUR.member_no === v)) { $('qNo').blur(); doLookup(); }
};
let CUR = null, CLAIMING = false;
async function doLookup(){
  const raw = $('qNo').value.trim();
  if (!raw.replace(/\D/g,'')) { toast('請輸入社籍號碼', true); return; }
  if (IS_TOUCH) $('qNo').blur();
  try { CUR = await rpc('elder_lookup', { p_no: raw, p_ver: APP_VER }); renderResult(); }
  catch(e){ toast(e.message, true); }
}
function renderResult(){
  const r = CUR, box = $('qResult');
  if (r.blocked) {
    box.innerHTML = `<div class="alert same">⛔ ${esc(r.error)}</div>`; CUR = null; toast(r.error, true); return;
  }
  if (!r.found) {
    box.innerHTML = `<div class="mbox none"><div class="mno">社籍號碼<b>${esc(r.member_no)}</b></div>
      <div class="state no" style="margin-left:auto">查無此社籍號碼<br><span class="muted" style="font-size:17px;font-weight:400">不在本次敬老金名單內</span></div></div>`;
    return;
  }
  const pend = r.reprints.filter(x => !x.addr_updated);
  const notes = r.notes || [];
  const same = r.same_name || [];
  const needId = r.amount==2000 || same.length > 0, needAddr = r.amount==2000;
  let h = '';
  if (same.length) h += `<div class="alert same">⚠ 同名同姓！本號碼與 ${same.map(s => `<b>${esc(s.member_no)}</b>${s.claimed?'（已領）':'（未領）'}`).join('、')} 姓名相同或相近。
    <div style="font-weight:500;margin-top:6px">請務必核對<b>身分證字號</b>，並確認換領券上的社籍號碼就是 ${esc(r.member_no)}，再銷帳。</div></div>`;
  notes.forEach(n => { h += `<div class="alert note">${esc(n.note)}
    <div class="muted" style="font-weight:500;margin-top:6px;font-size:15px">${esc(n.branch_name)}・${tw(n.created_at)}
    <button class="btn btn-soft" style="font-size:15px;padding:4px 12px;margin-left:8px" data-noteok="${n.id}">已處理，移除註記</button></div></div>`; });
  if (pend.length) h += `<div class="alert">⚠ 此社員曾補發通知單，請提醒至櫃檯更新收件地址（${pend.length} 筆未更新）</div>`;
  h += `<div class="mbox ${r.claimed?'done':'free'}">
      <div class="mno">社籍號碼<b>${esc(r.member_no)}</b></div>
      <div class="amt ${r.amount==2000?'a2000':''}">${money(r.amount)}<small> 元</small></div>
      <div class="state ${r.claimed?'no':'ok'}">${r.claimed
        ? `已領取<br><span style="font-size:18px;font-weight:500">${esc(r.claim.branch_name)}・${tw(r.claim.claimed_at)}${r.claim.by_proxy?'・代領':''}</span>`
        : '尚未領取'}</div></div>`;

  if (!r.claimed && !ME.is_admin) {
    h += `<div class="actions">
      <div class="radio">
        <label><input type="radio" name="who" value="self" checked><span>本人領取</span></label>
        <label><input type="radio" name="who" value="proxy"><span>代領</span></label>
      </div>
      ${needAddr ? `<div class="alert soft">2,000 元（100 歲）須核對下列兩項，以利後續扣繳申報：</div>` : ''}
      ${needId ? `<label class="chk"><input type="checkbox" id="ck1">已核對身分證字號與社籍資料一致${same.length?'，確認是 '+esc(r.member_no)+' 本人':''}</label>` : ''}
      ${needAddr ? `<label class="chk"><input type="checkbox" id="ck2">已核對「戶籍地址」與社籍資料一致</label>` : ''}
      <button class="btn btn-main bigbtn" id="claimBtn">確認銷帳 ${money(r.amount)} 元</button>
      <div class="muted" style="text-align:center;margin-top:6px">${IS_TOUCH ? (needId?'勾選核對後點下方按鈕銷帳':'點下方按鈕即可銷帳') : (needId?'勾選核對後按 Enter 即可銷帳':'再按 Enter 銷帳｜按 Tab 切換本人／代領')}</div></div>`;
  }
  if (r.claimed && r.claim.can_undo) {
    h += `<div class="actions"><button class="btn btn-soft" id="undoBtn">撤銷這筆銷帳</button>
      <span class="muted" style="margin-left:10px">${ME.is_admin?'管理員可撤銷任何一筆':'僅限本社當天銷帳可撤銷'}</span></div>`;
  }

  // 補發紀錄
  h += `<div class="card" style="background:#FBFDFC;margin-top:18px"><h2 style="font-size:19px">補發通知單紀錄</h2>`;
  h += r.reprints.length ? r.reprints.map(x => `<div class="rp" data-rp="${x.id}">
      <span class="tag ${x.addr_updated?'done':'pend'}">${x.addr_updated?'地址已更新':'待更新地址'}</span>
      <span>${tw(x.created_at)}・${esc(x.branch_name)}・補發經辦名字 <b>${esc(x.staff_name)}</b>${x.note?`・${esc(x.note)}`:''}${x.edited_at?' <span class="muted">（已修改）</span>':''}</span>
      ${x.addr_updated ? `<span class="muted">（${tw(x.addr_updated_at)} ${esc(x.addr_updated_branch)} ${esc(x.addr_updated_staff)}）</span>`
        : `<button class="btn btn-clay" style="margin-left:auto;font-size:17px;padding:8px 14px" data-addr="${x.id}">已至櫃檯更新地址</button>`}
      <button class="btn btn-main" style="font-size:16px;padding:6px 12px" data-rpprint="1">列印補發通知單</button>
      ${x.can_edit ? `<button class="btn btn-soft" style="font-size:16px;padding:6px 12px" data-rpedit="${x.id}">修改</button>
        <button class="btn btn-soft" style="font-size:16px;padding:6px 12px" data-rpcancel="${x.id}">取消登記</button>` : ''}
    </div>`).join('') : `<div class="muted">無</div>`;
  h += `<details class="rpform"><summary>＋ 登記補發通知單（社員說沒收到）</summary>
      <div class="row2" style="margin-top:12px">
        <label class="field"><span>補發經辦名字</span><input type="text" id="rpStaff" value="${esc(staffName())}"></label>
        <label class="field"><span>備註（選填）</span><input type="text" id="rpNote" placeholder="例：搬家未收到"></label>
        <button class="btn btn-clay" id="rpBtn">登記並列印</button>
      </div>
      <div class="muted" style="margin-top:6px">登記後會註記「待更新地址」，請引導社員至櫃檯辦理社籍地址變更。</div>
    </details>
    <details class="rpform"><summary>＋ 新增註記（例：同名同姓待確認）</summary>
      <div class="row2" style="margin-top:12px;grid-template-columns:1fr auto">
        <label class="field"><span>註記內容（所有分社查此號碼都會看到）</span><input type="text" id="noteText"></label>
        <button class="btn btn-clay" id="noteBtn">新增註記</button>
      </div>
    </details></div>`;
  box.innerHTML = h;

  const cb = $('claimBtn');
  if (cb) {
    const sync = () => { cb.disabled = !((!needId || $('ck1').checked) && (!needAddr || $('ck2').checked)); if (!cb.disabled && needId) cb.focus(); };
    if (needId) $('ck1').onchange = sync;
    if (needAddr) $('ck2').onchange = sync;
    sync();
    cb.onclick = doClaim;
  }
  if ($('undoBtn')) $('undoBtn').onclick = doUndo;
  if ($('rpBtn')) $('rpBtn').onclick = doReprint;
  if ($('noteBtn')) $('noteBtn').onclick = async () => {
    const t = $('noteText').value.trim(); if (!t) { toast('請填註記內容', true); return; }
    try { await rpc('elder_note_add', { p_no: CUR.member_no, p_note: t }); toast('已新增註記'); await doLookup(); } catch(e){ toast(e.message, true); }
  };
  box.querySelectorAll('[data-noteok]').forEach(b => b.onclick = async () => {
    if (!confirm('確定這個註記已處理完、要移除？')) return;
    try { await rpc('elder_note_resolve', { p_id: +b.dataset.noteok }); toast('已移除註記'); await doLookup(); } catch(e){ toast(e.message, true); }
  });
  box.querySelectorAll('[data-addr]').forEach(b => b.onclick = () => doAddr(+b.dataset.addr));
  bindReprintEdit(box, r.reprints, doLookup);
  box.querySelectorAll('[data-rpprint]').forEach(b => b.onclick = () => printNotice(r.member_no, r.amount));
  if (IS_TOUCH) box.scrollIntoView({behavior:'smooth', block:'start'});
}
// 補發登記：修改 / 取消（本分社或管理員）
function bindReprintEdit(root, list, after){
  root.querySelectorAll('[data-rpedit]').forEach(b => b.onclick = () => {
    const id = +b.dataset.rpedit, x = list.find(v => v.id === id);
    const holder = b.closest('[data-rp]') || b.closest('tr');
    const form = document.createElement('div');
    form.className = 'row2'; form.style.cssText = 'margin:10px 0;width:100%';
    form.innerHTML = `<label class="field"><span>補發經辦名字</span><input type="text" class="eStaff" value="${esc(x.staff_name)}"></label>
      <label class="field"><span>備註</span><input type="text" class="eNote" value="${esc(x.note||'')}"></label>
      <div style="display:flex;gap:8px"><button class="btn btn-main eSave">儲存</button><button class="btn btn-soft eBack">取消</button></div>`;
    if (holder.tagName === 'TR') {
      const tr = document.createElement('tr'); const td = document.createElement('td'); td.colSpan = 7; td.appendChild(form); tr.appendChild(td);
      holder.after(tr); form.querySelector('.eBack').onclick = () => tr.remove();
    } else {
      holder.appendChild(form); form.querySelector('.eBack').onclick = () => form.remove();
    }
    form.querySelector('.eStaff').focus();
    form.querySelector('.eSave').onclick = async () => {
      const s = form.querySelector('.eStaff').value.trim();
      if (!s) { toast('請填補發經辦名字', true); return; }
      try { await rpc('elder_reprint_edit', { p_id: id, p_staff: s, p_note: form.querySelector('.eNote').value }); toast('已修改'); after(); }
      catch(e){ toast(e.message, true); }
    };
  });
  root.querySelectorAll('[data-rpcancel]').forEach(b => b.onclick = async () => {
    if (!confirm('確定取消這筆補發登記？（登記錯誤時使用）')) return;
    try { await rpc('elder_reprint_cancel', { p_id: +b.dataset.rpcancel }); toast('已取消登記'); after(); }
    catch(e){ toast(e.message, true); }
  });
}
async function doClaim(){
  if (CLAIMING) return;
  if (CUR && (CUR.notes||[]).length && !confirm('此號碼有「待確認註記」，請確認已核對身分證、確定是本人號碼後再銷帳。\n\n確定要銷帳？')) return;
  const r = CUR, btn = $('claimBtn'); btn.disabled = true; CLAIMING = true;
  try { await doClaimInner(r, btn); } finally { CLAIMING = false; }
}
async function doClaimInner(r, btn){
  const proxy = document.querySelector('input[name=who]:checked').value === 'proxy';
  try {
    await rpc('elder_claim', { p_ver: APP_VER, p_no: r.member_no, p_by_proxy: proxy,
      p_id_checked: $('ck1') ? $('ck1').checked : false,
      p_addr_checked: $('ck2') ? $('ck2').checked : false });
    const bf = backfillNow();
    toast(`✔ ${r.member_no} 已銷帳 ${money(r.amount)} 元${bf ? `（算 ${rocDate(bf.asDay)}）` : ''}`);
    CUR = null; $('qNo').value = '';
    if (IS_TOUCH) {
      $('qResult').innerHTML = `<div class="mbox free" style="justify-content:center;text-align:center;flex-direction:column">
        <div style="font-size:48px">✔</div><div class="amt" style="font-size:30px">${esc(r.member_no)} 已銷帳 ${money(r.amount)} 元</div>
        <button class="btn btn-main bigbtn" id="nextBtn">下一位</button></div>`;
      $('nextBtn').onclick = () => { $('qResult').innerHTML = ''; $('qNo').focus(); };
      window.scrollTo({top:0, behavior:'smooth'});
    } else { $('qResult').innerHTML = ''; $('qNo').focus(); }
  } catch(e){ toast(e.message, true); btn.disabled = false; doLookup(); }
}
async function doUndo(){
  if (!confirm(`確定撤銷 ${CUR.member_no} 的銷帳？`)) return;
  try { await rpc('elder_undo', { p_no: CUR.member_no }); toast('已撤銷'); await doLookup(); }
  catch(e){ toast(e.message, true); }
}
async function doReprint(){
  const s = $('rpStaff').value.trim();
  if (!s) { toast('請填補發經辦姓名', true); return; }
  saveStaff(s);
  const no = CUR.member_no, amt = CUR.amount;
  const w = openPrintWin();            // 先在點按當下開視窗，Safari 才不會擋
  try { await rpc('elder_reprint', { p_no: no, p_staff: s, p_note: $('rpNote').value }); toast('已登記補發，開啟列印…'); if (w) printNotice(no, amt, w); await doLookup(); }
  catch(e){ if (w) w.close(); toast(e.message, true); }
}
async function doAddr(id){
  const s = prompt('請輸入辦理地址更新的經辦名字', staffName());
  if (!s || !s.trim()) return;
  saveStaff(s.trim());
  try { await rpc('elder_addr_done', { p_id: id, p_staff: s.trim() }); toast('已註記地址更新');
    if (CUR && !$('tab-lookup').classList.contains('hidden')) await doLookup(); else loadReprints(); }
  catch(e){ toast(e.message, true); }
}

const reconHead = first => `<thead><tr><th rowspan="2">${first}</th><th colspan="2" class="g">500 元</th><th colspan="2" class="g">1,000 元</th><th colspan="2" class="g">2,000 元</th><th colspan="2" class="g">合計</th></tr>

// r = {label, n500, n1000, n2000}
const reconRow = (r, cls='', tdAttr='') => {
  const cnt = r.n500+r.n1000+r.n2000, amt = r.n500*500+r.n1000*1000+r.n2000*2000;
  return `<tr class="${cls}"><td ${tdAttr}>${r.label}</td>
    <td class="g">${r.n500}</td><td>${money(r.n500*500)}</td>
    <td class="g">${r.n1000}</td><td>${money(r.n1000*1000)}</td>
    <td class="g">${r.n2000}</td><td>${money(r.n2000*2000)}</td>
    <td class="g">${cnt}</td><td>${money(amt)}</td></tr>`;
};
const addUp = (rows, label) => rows.reduce((a,r)=>({label, n500:a.n500+r.n500, n1000:a.n1000+r.n1000, n2000:a.n2000+r.n2000}), {label,n500:0,n1000:0,n2000:0});
const allDays = extra => [...new Set([...PERIOD, ...extra])].sort();

// 管理員：每日對帳
function reconData(){
  const claims = ADMIN_DATA.claims;
  const days = allDays(claims.map(c => (c.biz_date || twDateKey(c.claimed_at))));
  const map = {}; // day|branch|amount -> n
  claims.forEach(c => { const k = `${(c.biz_date || twDateKey(c.claimed_at))}|${c.branch_code}|${c.amount}`; map[k]=(map[k]||0)+1; });
  const get = (d,b,a) => map[`${d}|${b}|${a}`]||0;
  return { days, get };
}
function initReconFilters(days){
  const sd = $('rcDay'), sb_ = $('rcBranch'), cd = sd.value, cb = sb_.value;
  sd.innerHTML = `<option value="">全部日期</option><option value="__byday">只看每日合計</option>` + days.map(d=>`<option value="${d}">${rocDate(d)}</option>`).join('');
  sb_.innerHTML = `<option value="">全部分社</option>` + BRANCHES.map(([c,n])=>`<option value="${c}">${c} ${n}</option>`).join('');
  if ([...sd.options].some(o=>o.value===cd)) sd.value = cd;
  sb_.value = cb;
}
function renderRecon(){
  if (!ADMIN_DATA) return;
  const { days, get } = reconData();
  if (!$('rcDay').options.length || $('rcDay').options.length !== days.length+2) initReconFilters(days);
  $('rcBody').innerHTML = reconHtml();
}
function reconHtml(){
  const { days, get } = reconData();
  const fd = $('rcDay').value, fb = $('rcBranch').value;
  const brs = BRANCHES.filter(([c]) => !fb || c===fb);
  const HQ = BRANCHES[0], SUBS = BRANCHES.slice(1);   // 0016 總社；0025–0168 分社
  const rowFor = (d,[c,n]) => ({ label:`${c} ${n}`, n500:get(d,c,500), n1000:get(d,c,1000), n2000:get(d,c,2000) });
  const sumOver = (ds, list, label) => addUp(ds.flatMap(d => list.map(b => rowFor(d,b))), label);
  // 三行彙總：總社 / 分社小計（總分社往來）/ 全社合計
  const splitRows = (ds, prefix='') => {
    const hq  = sumOver(ds, [HQ], `${prefix}總社 0016 營業部`);
    const sub = sumOver(ds, SUBS, `${prefix}分社小計 0025–0168　<span class="tag pend">總分社往來</span>`);
    const all = sumOver(ds, BRANCHES, `${prefix}全社合計 0016–0168`);
    return reconRow(hq,'split') + reconRow(sub,'subsum') + reconRow(all,'grand');
  };
  const table = (head, body) => `<div class="tablebox" style="max-height:none"><table class="recon">${reconHead(head)}<tbody>${body}</tbody></table></div>`;
  let html = '';
  if (fd === '__byday') {
    if (fb) {
      const rows = days.map(d => addUp(brs.map(b=>rowFor(d,b)), shortDay(d)));
      html = table('日期', rows.map(r=>reconRow(r)).join('') + reconRow(addUp(rows,'期間合計'),'grand'));
    } else {
      html = table('日期／項目', days.map(d => splitRows([d], `${shortDay(d)}　`)).join('') + splitRows(days, '期間累計　'));
    }
  } else {
    const ds = fd ? [fd] : days;
    ds.forEach(d => {
      const body = brs.map(b => reconRow(rowFor(d,b), b[0]===HQ[0] && !fb ? 'hqrow' : '')).join('')
        + (fb ? reconRow(addUp(brs.map(b=>rowFor(d,b)), `${shortDay(d)} 合計`),'daysum') : splitRows([d]));
      html += `<div class="dayhead">${rocDate(d)}</div>` + table('分社', body);
    });
    if (!fd) {
      const per = brs.map(b => addUp(days.map(d=>rowFor(d,b)), `${b[0]} ${b[1]}`));
      html += `<div class="dayhead">期間累計（各分社）</div>` + table('分社',
        per.map((r,i)=>reconRow(r, brs[i][0]===HQ[0] && !fb ? 'hqrow' : '')).join('') + (fb ? reconRow(addUp(per,'期間合計'),'grand') : splitRows(days)));
    }
  }
  return html;
}
['rcDay','rcBranch'].forEach(id => $(id).onchange = () => { $('rcBody').innerHTML = reconHtml(); });

$('rcCsv').onclick = () => {
  const { days, get } = reconData();
  const rows = [['日期','分社代號','分社','500元筆數','500元金額','1000元筆數','1000元金額','2000元筆數','2000元金額','合計筆數','合計金額']];
  const sumLine = (d, list, code, name) => { let x=0,y=0,z=0; list.forEach(([c]) => { x+=get(d,c,500); y+=get(d,c,1000); z+=get(d,c,2000); });
    rows.push([rocDate(d), code, name, x, x*500, y, y*1000, z, z*2000, x+y+z, x*500+y*1000+z*2000]); };
  days.forEach(d => { BRANCHES.forEach(([c,n]) => {
    const a=get(d,c,500), b=get(d,c,1000), e=get(d,c,2000);
    rows.push([rocDate(d), c, n, a, a*500, b, b*1000, e, e*2000, a+b+e, a*500+b*1000+e*2000]);
  });
    sumLine(d, BRANCHES.slice(0,1), '0016', '總社小計');
    sumLine(d, BRANCHES.slice(1), '0025-0168', '分社小計（總分社往來）');
    sumLine(d, BRANCHES, '0016-0168', '全社合計');
  });
  csvDownload(`敬老金每日對帳_${todayKey()}.csv`, rows);
};

function genPw(n=10){
  const cs='abcdefghjkmnpqrstuvwxyz23456789', a=new Uint32Array(n); crypto.getRandomValues(a);
  return [...a].map(x => cs[x % cs.length]).join('');
}

      ${a.is_admin?'':`<button class="btn ${a.disabled?'btn-main':'btn-clay'}" style="font-size:15px;padding:4px 10px" data-dis="${a.branch_code}" data-v="${a.disabled?0:1}">${a.disabled?'啟用':'停用'}</button>`}</td></tr>`).join('')
    + `</tbody>`;
  $('acctTable').querySelectorAll('[data-pw]').forEach(b => b.onclick = async () => {
    const code = b.dataset.pw, pw = genPw(code==='9999'?12:10);
    if (!confirm(`確定重設 ${code==='9999'?'管理員':code} 的密碼？\n舊密碼會立即失效，該帳號所有裝置都會被登出。`)) return;

  });
}

  const list = $('rpShow').value==='pend' ? RP.filter(x=>!x.addr_updated) : RP;
  $('rpTable').innerHTML = `<thead><tr><th>補發時間</th><th>社籍號碼</th><th>補發分社</th><th>補發經辦名字</th><th>備註</th><th>地址</th><th></th></tr></thead><tbody>`
    + (list.length ? list.map(x => `<tr><td>${tw(x.created_at)}</td><td>${esc(x.member_no)}</td><td>${esc(x.branch_name)}</td><td>${esc(x.staff_name)}</td><td>${esc(x.note||'')}</td>
      <td>${x.addr_updated ? `<span class="tag done">已更新</span> ${tw(x.addr_updated_at)} ${esc(x.addr_updated_branch)} ${esc(x.addr_updated_staff)}`
        : `<button class="btn btn-clay" style="font-size:15px;padding:4px 10px" data-addr="${x.id}">已更新地址</button>`}</td>
      <td style="white-space:nowrap"><button class="btn btn-main" style="font-size:15px;padding:4px 10px" data-rpprint="${esc(x.member_no)}" data-amt="${x.amount}">列印</button>
        <button class="btn btn-soft" style="font-size:15px;padding:4px 10px" data-rpedit="${x.id}">修改</button>
        <button class="btn btn-soft" style="font-size:15px;padding:4px 10px" data-rpcancel="${x.id}">取消</button></td></tr>`).join('')
       : `<tr><td colspan="7" class="muted">沒有資料</td></tr>`) + `</tbody>`;
  $('rpTable').querySelectorAll('[data-addr]').forEach(b => b.onclick = () => doAddr(+b.dataset.addr));
  bindReprintEdit($('rpTable'), RP, loadReprints);
  $('rpTable').querySelectorAll('[data-rpprint]').forEach(b => b.onclick = () => printNotice(b.dataset.rpprint, +b.dataset.amt));
}
$('rpCsv').onclick = () => csvDownload(`敬老金補發名單_${todayKey()}.csv`, [['補發時間','社籍號碼','補發分社','補發經辦名字','備註','地址已更新','更新時間','更新分社','更新經辦'],
  ...RP.map(x=>[tw(x.created_at),x.member_no,x.branch_name,x.staff_name,x.note||'',x.addr_updated?'是':'否',x.addr_updated_at?tw(x.addr_updated_at):'',x.addr_updated_branch||'',x.addr_updated_staff||''])]);

/* ---------- 啟動 ---------- */
initLogin();
sb.auth.getSession().then(({ data }) => data.session ? enter() : showLogin());
</script>
</body>
</html>
